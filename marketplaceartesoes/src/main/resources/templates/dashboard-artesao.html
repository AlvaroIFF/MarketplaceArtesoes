<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo">
    <section class="user-dashboard">
        <h2>Dashboard do Artesão</h2>
        <p>Bem-vindo(a), <strong th:text="${artesao.nome}">Nome do Artesão</strong>!</p>

        <div class="dashboard-content">
            <div class="user-details">
                <h3>Informações da Loja</h3>
                <p><strong>Nome da Loja:</strong> <span th.text="${artesao.nomeLoja}"></span></p>
                <p><strong>Descrição:</strong> <span th.text="${artesao.descricaoLoja}"></span></p>
            </div>

            <div class="product-management">
                <h3>Meus Produtos</h3>
                <a th:href="@{/artesao/produtos/novo}" class="btn-primary">Adicionar Novo Produto</a>
                
                <div th:if="${produtos.isEmpty()}" class="mt-3">
                    <p>Você ainda não cadastrou nenhum produto.</p>
                </div>
                
                <table th:if="${!produtos.isEmpty()}" class="cart-table mt-3">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="produto : ${produtos}">
                            <td th:text="${produto.nome}">Nome do Produto</td>
                            <td th:text="${#numbers.formatCurrency(produto.preco)}">R$ 0,00</td>
                            <td>
                                <a href="#">Editar</a> | <a href="#">Remover</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>
</body>
</html>
