<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo-home">

    <section class="hero">
        <div class="hero-content">
            <h1>Onde a criatividade encontra um lar.</h1>
            <p>Descubra peças únicas, feitas à mão com paixão por artesões de todo o Brasil.</p>
            <a th:href="@{/produtos}" class="btn-primary">Explorar Produtos</a>
        </div>
    </section>

    <section class="featured-products">
        <h2>Produtos em Destaque</h2>
        <div class="product-grid">
            <div class="product-card" th:each="produto : ${produtos}">
                <a th:href="@{/produtos/{id}(id=${produto.id})}">
                <img th:src="${produto.imagemUrl}" alt="Foto do Produto">
                <h3 th:text="${produto.nome}">Nome do Produto</h3>
                <p class="artisan-name" th:text="${produto.nomeArtesao}">Nome do Artesão</p>
                <p class="price" th:text="${#numbers.formatCurrency(produto.preco)}">R$ 0,00</p>
                </a>
            </div>
        </div>
    </section>

    <section class="categories">
        <h2>Navegue por Categorias</h2>
        <div class="category-grid">
            <a th:href="@{/produtos(categoria='Cerâmica')}" class="category-card">
                <span>🏺</span>
                <h3>Cerâmica</h3>
            </a>
            <a th:href="@{/produtos(categoria='Têxteis')}" class="category-card">
                <span>🧶</span>
                <h3>Têxteis</h3>
            </a>
            <a th:href="@{/produtos(categoria='Jóias')}" class="category-card">
                <span>💍</span>
                <h3>Jóias</h3>
            </a>
            <a th:href="@{/produtos(categoria='Madeira')}" class="category-card">
                <span>🪵</span>
                <h3>Madeira</h3>
            </a>
        </div>
    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>

</body>
</html>
