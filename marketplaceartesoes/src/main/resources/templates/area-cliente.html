<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo conteudo-home">
    <section class="user-dashboard">
        <h2>Minha Conta</h2>

        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        
        <p>Bem-vindo(a) de volta, <strong th:text="${cliente.nome}">Nome do Cliente</strong>!</p>

        <div class="dashboard-content">
            <div class="user-details">
                <h3>Meus Dados</h3>
                <p><strong>Nome:</strong> <span th:text="${cliente.nome}"></span></p>
                <p><strong>E-mail:</strong> <span th:text="${cliente.email}"></span></p>
                <p><strong>CPF:</strong> <span th:text="${cliente.cpf}"></span></p>
                
                <a th:href="@{/clientes/editar}" class="btn-secondary">Editar Dados</a>
            </div>

            <div class="order-history">
                <h3>Histórico de Pedidos</h3>
                <div th:if="${pedidos.isEmpty()}">
                    <p>Você ainda não fez nenhum pedido.</p>
                </div>
                <table th:if="${!pedidos.isEmpty()}" class="cart-table">
                    <thead>
                        <tr>
                            <th>Nº do Pedido</th>
                            <th>Data</th>
                            <th>Valor Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${'#' + pedido.id}">#00001</td>
                            <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}">Data</td>
                            <td th:text="${#numbers.formatCurrency(pedido.valorTotal)}">R$ 0,00</td>
                            <td th:text="${pedido.status}">Status</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>

</body>
</html>
