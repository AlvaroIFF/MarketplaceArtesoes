<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo">
    <section class="form-container">
        <h2>Editar Meus Dados</h2>

        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <form th:action="@{/clientes/editar/processar}" th:object="${clienteUpdateDTO}" method="post" class="auth-form">
            
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" th:field="*{nome}" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" th:field="*{cpf}" placeholder="Apenas números" required>
                <small>Formato: 12345678900</small>
            </div>

            <div class="form-group">
                <label for="dtNasc">Data de Nascimento:</label>
                <input type="date" id="dtNasc" name="dtNasc" th:field="*{dtNasc}" required>
            </div>

            <div class="form-group">
                <label for="numContato">Número de Contato:</label>
                <input type="tel" id="numContato" name="numContato" th:field="*{numContato}" placeholder="Apenas números" required>
                <small>Formato: DD999999999</small>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" th:field="*{email}" required>
            </div>

            <button type="submit" class="btn-primary">Salvar Alterações</button>
            <a th:href="@{/clientes/area-cliente}" class="btn-secondary">Cancelar</a>
        </form>
    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>

</body>
</html>
