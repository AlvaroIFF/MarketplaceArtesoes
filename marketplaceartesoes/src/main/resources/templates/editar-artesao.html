<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo">
    <section class="form-container">
        <h2>Editar Perfil do Artesão e Loja</h2>

        <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
        <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

        <form th:action="@{/artesao/editar/processar}" th:object="${artesaoUpdateDTO}" method="post">
            <h3>Dados Pessoais</h3>
            
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" th:field="*{nome}" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" th:field="*{cpf}" pattern="[0-9]{11}" maxlength="11" placeholder="Somente números" required>
            </div>
            <div class="form-group">
                <label for="dtNasc">Data de Nascimento:</label>
                <input type="date" id="dtNasc" name="dtNasc" th:field="*{dtNasc}" required>
            </div>
            <div class="form-group">
                <label for="numContato">Número de Contato:</label>
                <input type="tel" id="numContato" name="numContato" th:field="*{numContato}" pattern="[0-9]{10,11}" placeholder="Somente números, ex: 22987654321">
            </div>

            <hr> <h3>Dados da Loja</h3>
            <div class="form-group">
                <label for="nomeLoja">Nome da Loja:</label>
                <input type="text" id="nomeLoja" name="nomeLoja" th:field="*{nomeLoja}" required>
            </div>
            <div class="form-group">
                <label for="descricaoLoja">Descrição da Loja:</label>
                <textarea id="descricaoLoja" name="descricaoLoja" th:field="*{descricaoLoja}" rows="4" maxlength="500"></textarea>
            </div>
            <div class="form-group">
                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" name="cnpj" th:field="*{cnpj}" pattern="[0-9]{14}" maxlength="14" placeholder="Somente números (opcional)">
            </div>

            <button type="submit" class="btn-primary">Salvar Alterações</button>
            <a th:href="@{/artesao/dashboard}" class="btn-secondary">Cancelar</a>
        </form>
    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>

</body>
</html>
