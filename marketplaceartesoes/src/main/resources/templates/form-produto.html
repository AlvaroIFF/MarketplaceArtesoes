<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo">
    <section class="form-container">
        <h2>Cadastrar Novo Produto</h2>
        <p>Preencha os dados abaixo para adicionar um novo item à sua loja.</p>

        <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>
        <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

        <form th:action="@{/artesao/produtos/salvar}" th:object="${produtoCadastroDTO}" method="post" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" th:field="*{descricao}" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" th:field="*{preco}" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="estoque">Quantidade em Estoque:</label>
                <input type="number" id="estoque" th:field="*{estoque}" min="0" required>
            </div>

            <div class="form-group">
                <label for="imagemProduto">Imagem do Produto:</label>
                <input type="file" id="imagemProduto" name="imagemProduto" class="form-control-file" accept="image/png, image/jpeg" required>
            </div>

            <div class="form-group">
                <label for="categoriaId">Categoria:</label>
                <select id="categoriaId" th:field="*{categoriaId}" required>
                    <option value="">Selecione uma categoria</option>
                    <option th:each="cat : ${todasCategorias}"
                            th:value="${cat.id}"
                            th:text="${cat.nome}">
                    </option>
                </select>
            </div>
            
            <button type="submit" class="btn-primary">Salvar Produto</button>
        </form>
    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>

</body>
</html>
