<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo">
    <section class="form-container">
        <h2>Seja um Artesão Parceiro</h2>
        <p>Crie sua conta e comece a vender suas criações em nossa plataforma.</p>

        <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

        <form th:action="@{/artesao/cadastrar}" th:object="${artesaoCadastroDTO}" method="post" enctype="multipart/form-data">
            
            <h3>Seus Dados Pessoais</h3>
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF (apenas números):</label>
                <input type="text" id="cpf" th:field="*{cpf}" required>
            </div>
            <div class="form-group">
                <label for="dtNasc">Data de Nascimento:</label>
                <input type="date" id="dtNasc" th:field="*{dtNasc}" required>
            </div>
            <div class="form-group">
                <label for="numContato">Celular (com DDD):</label>
                <input type="tel" id="numContato" th:field="*{numContato}" required>
            </div>
            
            <h3>Dados de Acesso</h3>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" th:field="*{senha}" required>
            </div>
            <div class="form-group">
                <label for="confirmarSenha">Confirmar Senha:</label>
                <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}" required>
            </div>
            
            <h3>Foto de Perfil</h3>
            <div class="form-group">
                <label for="foto">Foto de Perfil (Opcional):</label>
                <input type="file" id="foto" name="foto" class="form-control-file" accept="image/png, image/jpeg">
            </div>

            <h3>Dados da sua Loja</h3>
            <div class="form-group">
                <label for="nomeLoja">Nome da Loja:</label>
                <input type="text" id="nomeLoja" th:field="*{nomeLoja}" required>
            </div>
            <div class="form-group">
                <label for="descricaoLoja">Descrição Curta da Loja:</label>
                <textarea id="descricaoLoja" th:field="*{descricaoLoja}" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="cnpj">CNPJ (opcional):</label>
                <input type="text" id="cnpj" th:field="*{cnpj}">
            </div>
            <div class="form-group">
                <label for="fotoLoja">Imagem da Loja (Banner):</label>
                <input type="file" id="fotoLoja" name="fotoLoja" class="form-control-file" accept="image/png, image/jpeg">
            </div>
            
            <button type="submit" class="btn-primary">Criar Minha Conta e Loja</button>
        </form>
    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>

</body>
</html>
