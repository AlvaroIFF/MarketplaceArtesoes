<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo">
    <section class="form-container">
        <h2>Seja um Artesão Parceiro</h2>
        <p>Crie sua conta e comece a vender suas criações em nossa plataforma.</p>

        <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

        <form th:action="@{/artesao/cadastrar}" method="post">
            
            <h3>Seus Dados Pessoais</h3>
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF (apenas números):</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>
            <div class="form-group">
                <label for="dtNasc">Data de Nascimento:</label>
                <input type="date" id="dtNasc" name="dtNasc" required>
            </div>
            <div class="form-group">
                <label for="numContato">Celular (com DDD):</label>
                <input type="tel" id="numContato" name="numContato" required>
            </div>
            
            <h3>Dados de Acesso</h3>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div class="form-group">
                <label for="confirmarSenha">Confirmar Senha:</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" required>
            </div>

            <h3>Dados da sua Loja</h3>
            <div class="form-group">
                <label for="nomeLoja">Nome da Loja:</label>
                <input type="text" id="nomeLoja" name="nomeLoja" required>
            </div>
            <div class="form-group">
                <label for="descricaoLoja">Descrição Curta da Loja:</label>
                <textarea id="descricaoLoja" name="descricaoLoja" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="cnpj">CNPJ (opcional):</label>
                <input type="text" id="cnpj" name="cnpj">
            </div>
            
            <button type="submit" class="btn-primary">Criar Minha Conta e Loja</button>
        </form>
    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>

</body>
</html>
