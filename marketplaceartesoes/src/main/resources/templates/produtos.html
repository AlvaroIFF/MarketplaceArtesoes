<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: baseHead}"></head>
<body>

<header th:replace="~{baseLayout :: baseHeaderPage}"></header>

<main class="conteudo-principal">
    <section class="product-listing">

        <div class="listing-header">
            <h2>Nossos Produtos</h2>

            <div class="filtros-categorias-select">
                <label for="categoria-select">Filtrar por:</label>
                <select id="categoria-select" onchange="location = this.value;">
                    <option th:value="@{/produtos}" 
                            th:selected="${categoriaSelecionada == null}">Todos</option>
                    <option th:each="cat : ${categorias}" 
                            th:value="@{/produtos(categoria=${cat.nome})}" 
                            th:text="${cat.nome}"
                            th:selected="${#strings.equalsIgnoreCase(categoriaSelecionada, cat.nome)}">
                        Nome da Categoria
                    </option>
                </select>
            </div>
        </div>

        <div class="product-grid">
            <div class="product-card" th:each="produto : ${produtos}">
                <a th:href="@{/produtos/{id}(id=${produto.id})}">
                    <img th:src="${produto.imagemUrl}" alt="Foto do Produto">
                    <h3 th:text="${produto.nome}">Nome do Produto</h3>
                    <p class="artisan-name" th:text="${produto.nomeArtesao}">Nome do Artesão</p>
                    <p class="price" th:text="${#numbers.formatCurrency(produto.preco)}">R$ 0,00</p>
                </a>
            </div>

            <div th:if="${produtos.isEmpty()}">
                <p>Nenhum produto encontrado.</p>
            </div>
        </div>

    </section>
</main>

<footer th:replace="~{baseLayout :: baseFooterPage}"></footer>

</body>
</html>
